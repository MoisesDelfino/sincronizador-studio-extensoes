name: Build portable apps

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: StudioSync-Linux-amd64.tar.gz
          - os: windows-2022
            artifact: StudioSync-Windows-x64.zip
          - os: macos-15
            artifact: StudioSync-macOS-AppleSilicon.zip
            mac_arch: AppleSilicon
          - os: macos-15-intel
            artifact: StudioSync-macOS-Intel.zip
            mac_arch: Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-build.txt
      - name: Install bundled Chromium
        shell: bash
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/.playwright-browsers"
          python -m playwright install chromium
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
      - run: python -m unittest discover -s tools/studio_sync/tests -q
      - run: pyinstaller --clean --noconfirm StudioSync.spec
      - name: Package portable app for Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p release
          tar -C dist -czf release/${{ matrix.artifact }} StudioSync
      - name: Package portable app for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path dist/StudioSync.exe -DestinationPath release/${{ matrix.artifact }}
      - name: Package portable app for macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent "dist/Studio Sync.app" "release/${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/${{ matrix.artifact }}

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download portable apps
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release/*
