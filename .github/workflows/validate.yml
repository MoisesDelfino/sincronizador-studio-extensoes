name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/studio_sync/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r tools/studio_sync/requirements.txt
      - run: python validar.py
